<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EAAFF" />
      <stop offset="100%" stop-color="#2D74C9" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="8" flood-color="#a3b1c6" flood-opacity="0.6" />
      <feDropShadow dx="-4" dy="-4" stdDeviation="8" flood-color="#ffffff" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Neumorphic Base -->
  <rect width="256" height="256" rx="56" fill="#E0E5EC" />

  <!-- The "N" Monogram with Soft Shadowing -->
  <g filter="url(#softShadow)" transform="translate(10, 10)">
    <path d="M75 180 V70 h30 l40 65 V70 h25 v110 h-30 l-40 -65 v65 H75 Z" fill="url(#blueGrad)" />
  </g>
</svg>